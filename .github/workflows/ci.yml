name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      mongo:
        # Single-node replica set: required for multi-document transactions (Epic A1).
        image: mongodb/mongodb-community-server:7.0-ubuntu2204
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MongoDbSettings__ConnectionString: mongodb://localhost:27017
      MongoDbSettings__DatabaseName: VirtualStoreDb
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore VirtualStore.slnx

      - name: Build
        run: dotnet build VirtualStore.slnx -c Release --no-restore

      - name: Test (unit gate, no Docker required)
        run: dotnet test VirtualStore.slnx -c Release --no-build --verbosity normal --filter Category!=Integration

      - name: Test (full suite with coverage)
        run: dotnet test VirtualStore.slnx -c Release --no-build --verbosity normal --collect:"XPlat Code Coverage"
