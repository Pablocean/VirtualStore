name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore VirtualStore.slnx

      - name: Build
        run: dotnet build VirtualStore.slnx -c Release --no-restore

      - name: Test
        run: dotnet test VirtualStore.slnx -c Release --no-build --verbosity normal
